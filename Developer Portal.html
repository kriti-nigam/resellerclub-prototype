<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResellerClub — Developer Platform</title>
  <link rel="stylesheet" href="portal/theme.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--rc-bg); }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb { background: var(--rc-line-strong); border-radius: 999px; border: 3px solid var(--rc-bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--rc-text-3); }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#0C1322">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0C1322"/>
      <rect x="470" y="300" width="260" height="260" rx="64" fill="url(#g)"/>
      <path d="M548 392l66 72-66 72" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M636 536h78" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
      <defs>
        <linearGradient id="g" x1="470" y1="300" x2="730" y2="560" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3D82FF"/>
          <stop offset="1" stop-color="#0F52E0"/>
        </linearGradient>
      </defs>
    </svg>
  </template>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data (plain JS) -->
  <script src="portal/data.js"></script>

  <!-- Components & pages (Babel) -->
  <script type="text/babel" src="portal/tweaks-panel.jsx"></script>
  <script type="text/babel" src="portal/components.jsx"></script>
  <script type="text/babel" src="portal/Chrome.jsx"></script>
  <script type="text/babel" src="portal/Docs.jsx"></script>
  <script type="text/babel" src="portal/Guides.jsx"></script>
  <script type="text/babel" src="portal/AiPages.jsx"></script>
  <script type="text/babel" src="portal/Landing.jsx"></script>
  <script type="text/babel" src="portal/Dashboard.jsx"></script>
  <script type="text/babel" src="portal/DashboardView.jsx"></script>
  <script type="text/babel" src="portal/Onboarding.jsx"></script>
  <script type="text/babel" src="portal/App.jsx"></script>
</body>
</html>
