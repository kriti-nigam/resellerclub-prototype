<!-- @dsCard group="Colors" viewport="700x160" subtitle="Backgrounds, lines & text greys" name="Neutrals & text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  .wrap { display: flex; gap: 14px; padding: 22px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--rc-r-md); border: 1px solid var(--rc-line); }
  .name { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-2); margin-top: 9px; }
  .hex { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--rc-bg)"></div><div class="name">bg</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-bg-subtle)"></div><div class="name">bg-subtle</div><div class="hex">#F7F8FA</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-line-strong)"></div><div class="name">line-strong</div><div class="hex">#D7DBE2</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-text-3)"></div><div class="name">text-3</div><div class="hex">#8B93A2</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-text-2)"></div><div class="name">text-2</div><div class="hex">#515A6B</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-text)"></div><div class="name">text</div><div class="hex">#10151F</div></div>
  </div>
</body>
</html>
