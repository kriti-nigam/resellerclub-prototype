<!-- @dsCard group="Colors" viewport="700x150" subtitle="Signature bright-blue action ramp" name="Accent — bright blue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  .wrap { display: flex; gap: 0; padding: 22px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: 0; }
  .sw:first-child .chip { border-radius: var(--rc-r-md) 0 0 var(--rc-r-md); }
  .sw:last-child .chip { border-radius: 0 var(--rc-r-md) var(--rc-r-md) 0; }
  .name { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-2); margin-top: 9px; }
  .hex { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--rc-accent-300)"></div><div class="name">accent-300</div><div class="hex">#3D82FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-accent)"></div><div class="name">accent</div><div class="hex">#1E66FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-accent-600)"></div><div class="name">accent-600</div><div class="hex">#0F52E0</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-accent-700)"></div><div class="name">accent-700</div><div class="hex">#0A3FB0</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-accent-100)"></div><div class="name">accent-100</div><div class="hex">#D7E4FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-accent-50);border:1px solid var(--rc-line)"></div><div class="name">accent-50</div><div class="hex">#EDF3FF</div></div>
  </div>
</body>
</html>
