<!-- @dsCard group="Colors" viewport="700x160" subtitle="Reserved for API methods, status & savings" name="Semantic palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  .wrap { display: flex; gap: 12px; padding: 22px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 110px; }
  .chip { height: 50px; border-radius: var(--rc-r-md); display: flex; align-items: center; justify-content: center; font-family: var(--rc-font-mono); font-weight: 600; font-size: 12px; }
  .name { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-2); margin-top: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--rc-teal-soft);color:var(--rc-teal)">GET</div><div class="name">teal · #0FA68A</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-violet-soft);color:var(--rc-violet)">POST</div><div class="name">violet · #6D5EF6</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-amber-soft);color:#9A6406">PUT</div><div class="name">amber · #E89611</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-red-soft);color:var(--rc-red)">DELETE</div><div class="name">red · #E23B3B</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-green-soft);color:var(--rc-green)">LIVE</div><div class="name">green · #16A34A</div></div>
  </div>
</body>
</html>
