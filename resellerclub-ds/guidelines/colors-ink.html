<!-- @dsCard group="Colors" viewport="700x150" subtitle="Deep slate ink for dark surfaces & code" name="Ink & code surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  .wrap { display: flex; gap: 14px; padding: 22px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--rc-r-md); }
  .name { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-2); margin-top: 9px; }
  .hex { font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--rc-ink)"></div><div class="name">ink</div><div class="hex">#100E2B</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-ink-2)"></div><div class="name">ink-2</div><div class="hex">#171438</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-ink-3)"></div><div class="name">ink-3</div><div class="hex">#241F52</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-code-bg)"></div><div class="name">code-bg</div><div class="hex">#0D0B22</div></div>
    <div class="sw"><div class="chip" style="background:var(--rc-code-bg-2)"></div><div class="name">code-bg-2</div><div class="hex">#15122F</div></div>
  </div>
</body>
</html>
