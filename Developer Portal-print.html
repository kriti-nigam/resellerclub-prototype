<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResellerClub — Developer Platform (Print)</title>
  <link rel="stylesheet" href="portal/theme.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #root { min-height: 100vh; }

    .print-page { position: relative; }

    @media screen {
      .print-page { border-bottom: 2px dashed var(--rc-line-strong); }
    }

    @media print {
      @page { size: landscape; margin: 8mm; }
      html, body { background: #fff !important; }

      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      /* Freeze animations at their end state */
      *, *::before, *::after {
        animation-delay: -99s !important;
        animation-duration: .001s !important;
        animation-iteration-count: 1 !important;
        animation-fill-mode: both !important;
        animation-play-state: running !important;
        transition-duration: 0s !important;
      }

      /* One surface per page */
      .print-page { break-after: page; }
      .print-page:last-child { break-after: auto; }

      /* Neutralize sticky/scroll chrome so nothing floats or clips in print */
      .print-static-header > header { position: static !important; }
      .rc-scroll { overflow: visible !important; }

      /* Collapse full-viewport layouts so they don't waste a page */
      .print-dash > div { min-height: 0 !important; }
      .print-dash aside { height: auto !important; position: static !important; }
      .print-onb > .rc { min-height: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data (plain JS) -->
  <script src="portal/data.js"></script>

  <!-- Components & pages (Babel) -->
  <script type="text/babel" src="portal/components.jsx"></script>
  <script type="text/babel" src="portal/Chrome.jsx"></script>
  <script type="text/babel" src="portal/Docs.jsx"></script>
  <script type="text/babel" src="portal/Guides.jsx"></script>
  <script type="text/babel" src="portal/AiPages.jsx"></script>
  <script type="text/babel" src="portal/Landing.jsx"></script>
  <script type="text/babel" src="portal/Dashboard.jsx"></script>
  <script type="text/babel" src="portal/DashboardView.jsx"></script>
  <script type="text/babel" src="portal/Onboarding.jsx"></script>
  <script type="text/babel" src="portal/App-print.jsx"></script>
</body>
</html>
