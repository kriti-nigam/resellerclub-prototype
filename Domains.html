document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-display: swap;\n  src: url(\"b8d48139-02ca-413b-8033-2b50d9073118\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7e767bdd-2a8d-4f89-8763-5cadda3b44e4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"923f80dd-9638-4d35-9a3d-102aee09b97e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b8d48139-02ca-413b-8033-2b50d9073118\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Families ---- */\n  --rc-font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;\n  --rc-font-body:    'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;\n  --rc-font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* ---- Display type scale (clamped for fluid heroes) ---- */\n  --rc-display-xl: 700 clamp(40px, 5.2vw, 68px)/1.05 var(--rc-font-display);\n  --rc-display-lg: 700 clamp(32px, 3.6vw, 46px)/1.08 var(--rc-font-display);\n  --rc-display-md: 600 28px/1.12 var(--rc-font-display);\n  --rc-display-sm: 600 21px/1.2  var(--rc-font-display);\n\n  /* ---- Body scale ---- */\n  --rc-body-lg: 500 18px/1.6 var(--rc-font-body);\n  --rc-body:    400 16px/1.6 var(--rc-font-body);\n  --rc-body-sm: 400 14px/1.55 var(--rc-font-body);\n  --rc-caption: 500 12.5px/1.45 var(--rc-font-body);\n\n  /* ---- Tracking ---- */\n  --rc-track-tight:  -0.02em;  /* headlines */\n  --rc-track-snug:   -0.01em;  /* buttons, large body */\n  --rc-track-eyebrow: 0.16em;  /* uppercase eyebrows */\n}\n\n/* ============================================================\n   Color tokens.\n   Signature accent is one bright blue (#1E66FF). The system stays\n   disciplined \u2014 accent for action, deep slate ink for dark surfaces,\n   warm-neutral whites for backgrounds, plus a small semantic set\n   (teal/violet/amber/red) reserved for API methods & status.\n   ============================================================ */\n\n:root {\n  /* ---- Signature accent (bright blue) ---- */\n  --rc-accent:        #1E66FF;\n  --rc-accent-600:    #0F52E0;   /* hover */\n  --rc-accent-700:    #0A3FB0;   /* press / accent text on light */\n  --rc-accent-100:    #D7E4FF;   /* soft fill border */\n  --rc-accent-50:     #EDF3FF;   /* soft fill */\n  --rc-accent-tint:   #F4F7FE;   /* whisper-cool panel */\n  --rc-accent-300:    #3D82FF;   /* gradient top / brand mark */\n\n  /* ---- Ink / dark surfaces ---- */\n  --rc-ink:           #0C1322;   /* deepest */\n  --rc-ink-2:         #131C30;\n  --rc-ink-3:         #1E2940;\n  --rc-code-bg:       #0B1020;   /* code panel */\n  --rc-code-bg-2:     #121A2C;   /* code panel header / inset */\n\n  /* ---- Neutrals ---- */\n  --rc-white:         #FFFFFF;\n  --rc-bg:            #FFFFFF;\n  --rc-bg-subtle:     #F7F8FA;\n  --rc-bg-warm:       #FBF7F4;\n  --rc-line:          #E8EAEF;\n  --rc-line-2:        #EEF0F4;\n  --rc-line-strong:   #D7DBE2;\n  --rc-text:          #10151F;\n  --rc-text-2:        #515A6B;\n  --rc-text-3:        #8B93A2;\n  --rc-on-dark:       #FFFFFF;\n  --rc-on-dark-2:     #AEB7CA;\n  --rc-on-dark-3:     #707B92;\n\n  /* ---- Supporting / semantic (API methods, status, savings) ---- */\n  --rc-teal:          #0FA68A;   /* GET / success */\n  --rc-teal-soft:     #E2F5F0;\n  --rc-green:         #16A34A;   /* active / live */\n  --rc-green-soft:    #E6F6EC;\n  --rc-amber:         #E89611;   /* PUT / warning / pending */\n  --rc-amber-soft:    #FCF1DC;\n  --rc-red:           #E23B3B;   /* DELETE / danger / failed */\n  --rc-red-soft:      #FCE6E6;\n  --rc-violet:        #6D5EF6;   /* POST / accents */\n  --rc-violet-soft:   #ECEAFE;\n  --rc-blue:          #2563EB;\n  --rc-blue-soft:     #E5EDFD;\n}\n\n/* ============================================================\n   Layout tokens \u2014 radii, spacing scale (4px base), elevation, motion.\n   ============================================================ */\n\n:root {\n  /* ---- Radii ---- */\n  --rc-r-xs:   4px;\n  --rc-r-sm:   8px;\n  --rc-r-md:   10px;   /* default button / control */\n  --rc-r-lg:   14px;   /* code panels, cards */\n  --rc-r-xl:   18px;\n  --rc-r-2xl:  24px;\n  --rc-r-pill: 999px;  /* badges, dots */\n\n  /* ---- Spacing (4px base) ---- */\n  --rc-s-1: 4px;  --rc-s-2: 8px;   --rc-s-3: 12px;  --rc-s-4: 16px;\n  --rc-s-5: 20px; --rc-s-6: 24px;  --rc-s-8: 32px;  --rc-s-10: 40px;\n  --rc-s-12: 48px; --rc-s-16: 64px; --rc-s-20: 80px; --rc-s-24: 96px;\n\n  /* ---- Shadows (slate-tinted, never harsh black) ---- */\n  --rc-shadow-xs:     0 1px 2px rgba(12,19,34,.06);\n  --rc-shadow-sm:     0 2px 8px rgba(12,19,34,.07);\n  --rc-shadow-md:     0 10px 28px rgba(12,19,34,.10);\n  --rc-shadow-lg:     0 24px 60px rgba(12,19,34,.16);\n  --rc-shadow-accent: 0 10px 26px rgba(30,102,255,.32);   /* primary-button glow on hover */\n  --rc-ring:          0 0 0 4px rgba(30,102,255,.20);      /* focus ring */\n\n  /* ---- Motion ---- */\n  --rc-ease:     cubic-bezier(0.2, 0.7, 0.2, 1);   /* snappy in, smooth out */\n  --rc-ease-out: cubic-bezier(0, 0, 0.2, 1);\n  --rc-dur-fast: 120ms;   /* state toggles */\n  --rc-dur:      200ms;   /* default */\n  --rc-dur-slow: 320ms;   /* panel slides */\n}\n\n/* ============================================================\n   Base styles & helpers.\n   Wrap product content in class=\"rc\" to inherit the type defaults.\n   Everything below leans on the token vars, so it themes automatically.\n   ============================================================ */\n\n* { box-sizing: border-box; }\n\n.rc {\n  font-family: var(--rc-font-body);\n  color: var(--rc-text);\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n.rc h1, .rc h2, .rc h3, .rc h4, .rc h5 {\n  font-family: var(--rc-font-display);\n  margin: 0;\n  letter-spacing: var(--rc-track-tight);\n  color: var(--rc-text);\n  line-height: 1.08;\n  text-wrap: balance;\n}\n\n.rc p { margin: 0; }\n.rc a { color: inherit; text-decoration: none; }\n.rc button { font-family: inherit; }\n\n/* Eyebrow \u2014 uppercase, wide tracking, accent-700 */\n.rc-eyebrow {\n  font-family: var(--rc-font-body);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: var(--rc-track-eyebrow);\n  text-transform: uppercase;\n  color: var(--rc-accent-700);\n}\n\n/* Scrollbar polish for dark code panels */\n.rc-scroll::-webkit-scrollbar { height: 8px; width: 8px; }\n.rc-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 999px; }\n.rc-scroll::-webkit-scrollbar-track { background: transparent; }\n\n/* Selection */\n.rc ::selection { background: rgba(30,102,255,.22); }\n\n/* ---- Code syntax tokens (dark panels) ---- */\n.tk-key  { color: #6FB0FF; }\n.tk-str  { color: #7CD9A8; }\n.tk-num  { color: #E6B673; }\n.tk-bool { color: #C792EA; }\n.tk-kw   { color: #6FB0FF; }\n.tk-com  { color: #5C6680; font-style: italic; }\n\n/* ---- Keyframes ---- */\n@keyframes rc-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n@keyframes rc-fade    { from { opacity: 0; } to { opacity: 1; } }\n@keyframes rc-spin    { to { transform: rotate(360deg); } }\n@keyframes rc-pulse   { 0%,100% { opacity: 1; } 50% { opacity: .4; } }\n\n<\u002Fstyle>\n<style>/* ============================================================\n   ResellerClub wholesale site \u2014 shared component styles.\n   Consumes resellerclub-ds tokens. Link AFTER resellerclub-ds/styles.css.\n   All page chrome (nav, footer), section scaffolding, cards,\n   heroes, proof strips, code panels, tables, FAQ and CTA bands.\n   ============================================================ */\n\nhtml, body { margin: 0; padding: 0; background: var(--rc-bg); }\nmain { display: block; }\nimg { display: block; max-width: 100%; }\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n.wrap-narrow { max-width: 940px; margin: 0 auto; padding: 0 28px; }\nsection { position: relative; }\n\n/* ---- image / illustration placeholder ---- */\n.ph { position: relative; background: repeating-linear-gradient(135deg, var(--rc-bg-subtle) 0 14px, #eef0f4 14px 28px);\n  border: 1px solid var(--rc-line); border-radius: var(--rc-r-lg); overflow: hidden; }\n.ph::after { content: attr(data-label); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;\n  font-family: var(--rc-font-mono); font-size: 12px; color: var(--rc-text-3); letter-spacing: .02em; text-align: center; padding: 12px; }\n.ph.dark { background: repeating-linear-gradient(135deg, #16213a 0 14px, #1b2840 14px 28px); border-color: rgba(255,255,255,.08); }\n.ph.dark::after { color: var(--rc-on-dark-3); }\n\n/* ---- placeholder marker for unconfirmed numbers / claims ---- */\n.tbd { font-family: var(--rc-font-mono); font-size: .58em; font-weight: 600; color: var(--rc-text-3);\n  background: var(--rc-bg-subtle); border: 1px dashed var(--rc-line-strong); border-radius: 5px; padding: 2px 6px;\n  vertical-align: middle; letter-spacing: .01em; white-space: nowrap; }\n.ph-tag { font-family: var(--rc-font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;\n  color: var(--rc-text-3); background: var(--rc-bg-subtle); border: 1px dashed var(--rc-line-strong); border-radius: var(--rc-r-pill);\n  padding: 3px 9px; display: inline-block; }\n\n/* ============================================================\n   Buttons (scoped under .rc so DS `.rc a {color:inherit}` cannot win)\n   ============================================================ */\n.rc .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--rc-font-body); font-weight: 600; font-size: 15px;\n  letter-spacing: -.01em; border-radius: var(--rc-r-md); padding: 12px 20px; cursor: pointer; border: 1px solid transparent;\n  transition: all var(--rc-dur) var(--rc-ease); white-space: nowrap; text-decoration: none; }\n.rc .btn.lg { padding: 15px 26px; font-size: 16px; }\n.rc .btn.sm { padding: 9px 15px; font-size: 14px; }\n.rc .btn-primary { background: var(--rc-accent); color: #fff; }\n.rc .btn-primary:hover { background: var(--rc-accent-600); box-shadow: var(--rc-shadow-accent); transform: translateY(-1px); }\n.rc .btn-secondary { background: #fff; color: var(--rc-text); border-color: var(--rc-line-strong); box-shadow: var(--rc-shadow-xs); }\n.rc .btn-secondary:hover { background: var(--rc-bg-subtle); }\n.rc .btn-ghost { background: transparent; color: var(--rc-text-2); }\n.rc .btn-ghost:hover { color: var(--rc-text); }\n.rc .btn-ondark { background: rgba(255,255,255,.10); color: #fff; border-color: rgba(255,255,255,.22); }\n.rc .btn-ondark:hover { background: rgba(255,255,255,.18); }\n.rc .btn-light { background: #fff; color: var(--rc-ink); }\n.rc .btn-light:hover { box-shadow: var(--rc-shadow-md); transform: translateY(-1px); }\n\n.rc .tlink { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; color: var(--rc-accent-700); }\n.rc .tlink:hover { color: var(--rc-accent-600); }\n.rc .tlink.ondark { color: var(--rc-accent-300); }\n\n/* ---- Oracle Cloud co-brand badge pill (Section 8 lockup) ---- */\n.oc-pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--rc-font-body); font-weight: 600;\n  font-size: 12.5px; letter-spacing: -.005em; padding: 5px 12px; border-radius: var(--rc-r-pill); white-space: nowrap; }\n.oc-pill i, .oc-pill svg { width: 15px; height: 15px; flex-shrink: 0; }\n.oc-pill.light { color: var(--rc-accent-700); background: var(--rc-accent-50); border: 1px solid var(--rc-accent-100); }\n.oc-pill.light i, .oc-pill.light svg { color: var(--rc-accent); }\n.oc-pill.dark { color: #fff; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.20); }\n.oc-pill.dark i, .oc-pill.dark svg { color: var(--rc-accent-300); }\n\n/* ============================================================\n   Header + nav (sticky)\n   ============================================================ */\nheader.topbar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rc-line); }\n.nav-inner { display: flex; align-items: center; gap: 8px; height: 72px; }\n.logo { display: inline-flex; align-items: center; gap: 10px; margin-right: 18px; }\n.logo img { width: 34px; height: 34px; }\n.logo .name { font-family: var(--rc-font-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; color: var(--rc-text); }\n\n.menu { display: flex; align-items: center; }\n.nav-item { position: relative; }\n.nav-item > a { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 500; color: var(--rc-text-2); padding: 14px 13px; white-space: nowrap; cursor: pointer; }\n.nav-item > a:hover, .nav-item.active > a { color: var(--rc-text); }\n.nav-item.active > a { font-weight: 600; }\n.nav-item > a .chev { width: 15px; height: 15px; transition: t ; }\n.hero p.lead { font-size: 18px; line-height: 1.58; color: var(--rc-text-2); margin: 18px auto 0; max-width: 640px; }\n.hero-cta { display: flex; gap: 13px; margin-top: 30px; justify-content: center; flex-wrap: wrap; }\n.trust-line { display: flex; gap: 10px 14px; margin-top: 26px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 13.5px; color: var(--rc-text-2); }\n.trust-line .ti { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }\n.trust-line .ti .ic { color: var(--rc-accent); }\n.trust-line .dot-sep { color: var(--rc-line-strong); }\n\n/* ============================================================\n   Split hero (product pages, platform)\n   ============================================================ */\n.split-hero { padding: 64px 0 70px; }\n.split-grid { display: grid; grid-template-columns: 1.02fr 1fr; gap: 56px; align-items: center; }\n.split-copy h1 { font-family: var(--rc-font-display); font-weight: 700; font-size: clamp(34px, 4vw, 52px); line-height: 1.06;\n  letter-spacing: -.025em; color: var(--rc-text); margin: 16px 0 0; }\n.split-copy h1 .accent { color: var(--rc-accent); }\n.split-copy p.anchor { font-family: var(--rc-font-display); font-weight: 500; font-size: clamp(18px, 1.7vw, 22px); line-height: 1.38; letter-spacing: -.01em; color: var(--rc-text); margin: 18px 0 0; max-width: 520px; }\n.split-copy p.lead { font-size: 17.5px; line-height: 1.6; color: var(--rc-text-2); margin: 20px 0 0; max-width: 540px; }\n.split-copy .hero-cta { justify-content: flex-start; }\n.split-copy .trust-line { justify-content: flex-start; }\n\n/* illustration panel (non-transacting interface illustration) */\n.illus { position: relative; }\n.illus .glow { position: absolute; inset: -40px -20px; background: radial-gradient(420px 300px at 60% 40%, rgba(30,102,255,.16), transparent 70%); pointer-events: none; }\n.panel { position: relative; background: #fff; border: 1px solid var(--rc-line); border-radius: var(--rc-r-xl); box-shadow: var(--rc-shadow-lg); overflow: hidden; }\n.panel-head { display: flex; align-items: center; gap: 8px; padding: 13px 16px; background: var(--rc-bg-subtle); border-bottom: 1px solid var(--rc-line); }\n.panel-head .dot { width: 11px; height: 11px; border-radius: 999px; }\n.panel-head .ptitle { margin-left: 6px; font-family: var(--rc-font-mono); font-size: 12px; color: var(--rc-text-3); }\n.panel-head .ptag { margin-left: auto; font-family: var(--rc-font-mono); font-size: 11px; color: var(--rc-text-3); display: inline-flex; align-items: center; gap: 6px; }\n.panel-body { padding: 8px; }\n.drow { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: var(--rc-r-md); }\n.drow + .drow { border-top: 1px solid var(--rc-line-2); }\n.drow .dname { font-family: var(--rc-font-mono); font-size: 14px; color: var(--rc-text); }\n.drow .chips { margin-left: auto; display: flex; gap: 7px; }\n.chip { font-family: var(--rc-font-mono); font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 3px 9px; border-radius: var(--rc-r-pill); }\n.chip.ok { color: var(--rc-green); background: var(--rc-green-soft); }\n.chip.av { color: var(--rc-accent-700); background: var(--rc-accent-50); }\n.chip.warn { color: var(--rc-amber); background: var(--rc-amber-soft); }\n.chip.mute { color: var(--rc-text-3); background: var(--rc-bg-subtle); }\n.chip.danger { color: var(--rc-red); background: var(--rc-red-soft); }\n.illus-cap { font-family: var(--rc-font-mono); font-size: 11.5px; color: var(--rc-text-3); margin: 14px 2px 0; line-height: 1.5; position: relative; display: flex; gap: 7px; align-items: flex-start; }\n.illus-cap .ic { color: var(--rc-text-3); flex-shrink: 0; margin-top: 1px; }\n\n/* hero stock image + floating stat badge */\n.illus.hero-media { position: relative; }\n.illus.hero-media .glow { inset: -30px -10px; }\n.hero-photo { display: block; width: 100%; height: 480px; border-radius: 18px; box-shadow: var(--rc-shadow-lg); border: 1px solid va Fa>\n          <a class=\"mega-link\" href=\"https://helpdesk.resellerclub.com/\" target=\"_blank\"><span class=\"mi\"><i data-lucide=\"life-buoy\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">24/7 Chat<\u002Fspan><span class=\"md\">Chat with our support team<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"https://www.resellerclub.com/blog/\" target=\"_blank\"><span class=\"mi\"><i data-lucide=\"newspaper\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Blog<\u002Fspan><span class=\"md\">Product news and guides<\u002Fspan><\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv><div class=\"nav-right\">\n      <a class=\"btn btn-ghost sm\" href=\"https://www.resellerclub.com/login\">Sign in<\u002Fa>\n      <a class=\"btn btn-primary sm\" href=\"https://www.resellerclub.com/domain-reseller/signup-now\">Become a reseller<\u002Fa>\n    <\u002Fdiv>\n    <button class=\"hamburger\" aria-label=\"Menu\"><i data-lucide=\"menu\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fbutton>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n\n  <!-- ============ HERO (split) ============ -->\n  <section class=\"split-hero\">\n    <div class=\"wrap split-grid\">\n      <div class=\"split-copy\">\n        <span class=\"eyebrow\">Lead with domains<\u002Fspan>\n        <h1>The wholesale domain registrar built for the people who <span class=\"accent\">build the web.<\u002Fspan><\u002Fh1>\n        <p class=\"lead\">Domains are the product your customers start with, and the product that keeps them with you. Resell registration, transfer, renewal, and DNS on a registrar backbone we run for you. You set the retail price. You own the customer relationship.<\u002Fp>\n        <div class=\"hero-cta\">\n          <a class=\"btn btn-primary lg\" href=\"https://www.resellerclub.com/domain-reseller/signup-now\">Become a reseller<\u002Fa>\n          <a class=\"btn btn-secondary lg\" href=\"API &amp; Dev Portal - Coming Soon.html#home\">Explore the API <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n        <div class=\"trust-line\">\n          <span class=\"ti\"><i data-lucide=\"calendar-clock\" class=\"ic\" style=\"width:16px;height:16px\"><\u002Fi> 20+ years as a domain reseller platform<\u002Fspan>\n          <span class=\"dot-sep\">\u00b7<\u002Fspan>\n          <span class=\"ti\"><i data-lucide=\"shield-check\" class=\"ic\" style=\"width:16px;height:16px\"><\u002Fi> 100+ ICANN-accredited registrars on OrderBox<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"illus\">\n        <div class=\"glow\"><\u002Fdiv>\n        <!-- Hero asset: domains-hero-v4.jpg -->\n        <img src=\"57890029-991a-42a5-95c8-cc209276e554\" alt=\"Illustration of people searching for domain names with .com, .org, and .net extensions\" style=\"display:block;width:100%;height:auto\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ WHY RESELL DOMAINS ============ -->\n  <section class=\"sec alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">Why domains with us<\u002Fspan>\n        <h2>Wholesale economics, white-label, and a registrar backbone you do not have to run.<\u002Fh2>\n        <p>Domains are a high-frequency, recurring product. The margin is in the platform behind them. Here is what you get when you resell on ResellerClub.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"grid-2\">\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"trending-up\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>Wholesale pricing that scales with you<\u002Fh3><p>You buy at wholesale and set your own retail price. Margin stays with you on every registration, transfer, and renewal. The more you sell, the more you save, with volume-based tiers. <a class=\"tlink\" style=\"font-size:14px\" href=\"Pricing.html#tiers\">See volume tiers<\u002Fa><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"tag\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>White-label by default<\u002Fh3><p>Sell domains under your own brand. Your storefront, your control panel branding, your customer relationship. Your customers stay yours, and they never see ours.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"layers\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>The registrar backbone, run for you on OrderBox<\u002Fh3><p>ResellerClub runs on OrderBox, the same stable, proven platform behind 100+ ICANN-accredited registrars and 20+ years of domain expertise. Registry connections, accreditation, billing, renewals, and ICANN and registry compliance are handled for you. You do not build or maintain registrar infrastructure. You sell.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"globe\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>Broad TLD coverage<\u002Fh3><p>Offer the extensions your customers actually ask for, from legacy gTLDs to country codes and newer namespaces. 500+ TLDs to sell from.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ink-band\" style=\"margin-top:32px\">\n        <div class=\"glow\"><\u002Fdiv>\n        <div>\n          <p class=\"ib-fact\">20+ years as a domain reseller platform.<\u002Fp>\n          <p class=\"ib-sup\">Build your business with our comprehensive APIs that are easy to integrate and consume.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ib-right\"><a class=\"btn btn-light\" href=\"Platform &amp; API.html\">See how it works on Platform &amp; API <i data-lucide=\"arrow-right\" style=\"width:17px;height:17px\"><\u002Fi><\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ TLD COVERAGE + PRICE TEASERS ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">Coverage and pricing<\u002Fspan>\n        <h2>Transparent wholesale pricing, from day one.<\u002Fh2>\n\n      <\u002Fdiv>\n      <div class=\"teaser-grid\">\n        <div class=\"teaser\"><div class=\"tld\">.com<\u002Fdiv><div class=\"tprice\"><span class=\"from\">from <\u002Fspan><span class=\"tbd\">$X.XX/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"teaser\"><div class=\"tld\">.net<\u002Fdiv><div class=\"tprice\"><span class=\"from\">from <\u002Fspan><span class=\"tbd\">$X.XX/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"teaser\"><div class=\"tld\">.org<\u002Fdiv><div class=\"tprice\"><span class=\"from\">from <\u002Fspan><span class=\"tbd\">$X.XX/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"teaser\"><div class=\"tld\">.io<\u002Fdiv><div class=\"tprice\"><span class=\"from\">from <\u002Fspan><span class=\"tbd\">$X.XX/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"teaser\"><div class=\"tld\">.dev<\u002Fdiv><div class=\"tprice\"><span class=\"from\">from <\u002Fspan><span class=\"tbd\">$X.XX/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"teaser\"><div class=\"tld\">.co<\u002Fdiv><div class=\"tprice\"><span class=\"from\">from <\u002Fspan><span class=\"tbd\">$X.XX/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:28px;flex-wrap:wrap\">\n        <p style=\"font-size:15px;color:var(--rc-text-2);max-width:560px;line-height:1.55;margin:0\">The more you sell, the more you save. Wholesale tiers step down as your volume grows.<\u002Fp>\n        <a class=\"btn btn-primary\" href=\"Pricing.html\">See wholesale pricing <i data-lucide=\"arrow-right\" style=\"width:17px;height:17px\"><\u002Fi><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ LIFECYCLE MANAGEMENT ============ -->\n  <section class=\"sec alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">Domain lifecycle<\u002Fspan>\n        <h2>The full domain lifecycle, managed for the customers you serve.<\u002Fh2>\n        <p>Resellers manage domains at scale, across many customers, for years at a time. The platform gives you the full lifecycle in one place.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feat-grid\">\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"plus-circle\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Register<\u002Fh4><p>Register domains across your supported TLDs in single or bulk operations.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"repeat\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Transfer<\u002Fh4><p>Bring domains in and move them out with standard transfer and auth-code handling.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"refresh-cw\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Renew<\u002Fh4><p>Manual and auto-renew, with expiry and grace-period handling so customer domains do not lapse by accident.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"network\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>DNS management<\u002Fh4><p>Full DNS records per domain, with Premium DNS available as an upgrade.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"eye-off\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>WHOIS privacy<\u002Fh4><p>Offer privacy protection on supported TLDs to keep customer contact details out of public records.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"lock\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Registrar and transfer locks<\u002Fh4><p>Apply locks to protect customer domains against unauthorized transfers.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"layers-3\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Bulk tools<\u002Fh4><p>Search, register, renew, and update records across many domains at once, built for portfolios, not single names.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"hourglass\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Expiry and grace handling<\u002Fh4><p>Clear status through expiry, grace, and redemption windows, so you always know where a domain stands.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATTACH PRODUCTS ============ -->\n  <section class=\"sec tight alt\">\n    <div class=\"wrap\">\n      <div class=\"split-2\" style=\"align-items:center\">\n        <div>\n          <span class=\"sec-eyebrow\">Attach and grow<\u002Fspan>\n          <h2 style=\"font-family:var(--rc-font-display);font-weight:700;font-size:clamp(28px,3.2vw,40px);letter-spacing:-.02em;margin:13px 0 0;color:var(--rc-text);line-height:1.12\">Add the products your customers need next.<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--rc-text-2);margin:16px 0 24px;max-width:520px\">Domains open the relationship. Attach products raise revenue per customer and keep more of their stack on your platform.<\u002Fp>\n          <div class=\"wl-list\">\n            <div class=\"wl-item\"><i data-lucide=\"mail\" class=\"wic\" style=\"width:20px;height:20px\"><\u002Fi><div><h4>Email<\u002Fh4><p>Attach professional email (Titan and Google Workspace) to every domain you sell. <a class=\"tlink\" style=\"font-size:14px\" href=\"Email.html\">Explore email<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n            <div class=\"wl-item\"><i data-lucide=\"shield-check\" class=\"wic\" style=\"width:20px;height:20px\"><\u002Fi><div><h4>SSL certificates<\u002Fh4><p>Add SSL to secure your customers' sites and lift trust on every domain. <a class=\"tlink\" style=\"font-size:14px\" href=\"SSL Certificates.html\">Explore SSL<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n            <div class=\"wl-item\"><i data-lucide=\"server\" class=\"wic\" style=\"width:20px;height:20px\"><\u002Fi><div><h4>Hosting<\u002Fh4><p>Resell hosting to your customers, powered by Oracle Cloud, attached to the domains they already buy from you. <a class=\"tlink\" style=\"font-size:14px\" href=\"Hosting.html\">Explore hosting<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"illus\">\n          <div class=\"glow\"><\u002Fdiv>\n          <!-- Attach and grow asset: hosting-attach-and-grow-v2.png -->\n          <img src=\"site\u002Fassets\u002Fhosting-attach-and-grow-v2.png\" alt=\"Isometric illustration of domain, hosting, email, and security services attaching together with a growth chart\" style=\"display:block;width:100%;height:auto\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PROOF STRIP ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\" style=\"margin-bottom:36px\">\n        <span class=\"sec-eyebrow\">Proof<\u002Fspan>\n        <h2>A platform built for the channel for 20+ years.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"proof-band\">\n        <div class=\"proof-block\"><div class=\"pnum\">20+<\u002Fdiv><div class=\"pdesc\">Years as a domain reseller platform.<\u002Fdiv><\u002Fdiv>\n        <div class=\"proof-block\"><div class=\"pnum\">100+<\u002Fdiv><div class=\"pdesc\">ICANN-accredited registrars on OrderBox.<\u002Fdiv><\u002Fdiv>\n        <div class=\"proof-block\"><div class=\"pnum\">18M<\u002Fdiv><div class=\"pdesc\">Domains under management.<\u002Fdiv><\u002Fdiv>\n        <div class=\"proof-block\"><div class=\"pnum\">100,000+<\u002Fdiv><div class=\"pdesc\">Resellers on our platform.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ FAQ ============ -->\n  <section class=\"sec alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">FAQs<\u002Fspan>\n        <h2>Frequently asked questions<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"faq\">\n        <details open=\"\"><summary>How do I start reselling domains? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary><div class=\"fa-body\">Sign up as a reseller, fund your account, and you can start registering domains at wholesale immediately. You set your own retail prices and sell under your own brand.<\u002Fdiv><\u002Fdetails>\n        <details><summary>How does wholesale pricing work? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary><div class=\"fa-body\">You buy at wholesale and set your own retail price. The margin on every registration, transfer, and renewal stays with you, and wholesale tiers step down as your volume grows. Current tiers are on the Pricing page.<\u002Fdiv><\u002Fdetails>\n        <details><summary>Is the platform white-label? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary><div class=\"fa-body\">Yes. Your customers see your brand, your prices, and your storefront. ResellerClub stays invisible to them while we run the registrar backbone for you.<\u002Fdiv><\u002Fdetails>\n        <details><summary>Can I integrate domains into my own platform? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary><div class=\"fa-body\">Yes. A modern HTTP API lets you provision, manage, and renew domains programmatically from your own platform, billing, and onboarding flows.<\u002Fdiv><\u002Fdetails>\n        <details><summary>Can I transfer existing domains to ResellerClub? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary><div class=\"fa-body\">Yes. Bulk transfer tooling moves existing portfolios in, and domains you manage stay portable, with clear status through expiry, grace, and redemption.<\u002Fdiv><\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <!-- ============ CLOSING CTA ============ -->\n  <section class=\"cta\">\n    <div class=\"wrap\">\n      <div class=\"cta-ink\">\n        <div class=\"glow\"><\u002Fdiv>\n        <span class=\"eyebrow\">Get started<\u002Fspan>\n        <h2>Start reselling domains on a platform built for the channel.<\u002Fh2>\n        <p>Become a reseller and sell domains under your own brand, at wholesale, with the backbone run for you. Or look at the API first.<\u002Fp>\n        <div class=\"cta-actions\">\n          <a class=\"btn btn-primary lg\" href=\"https://www.resellerclub.com/domain-reseller/signup-now\">Become a reseller<\u002Fa>\n          <a class=\"btn btn-ondark lg\" href=\"API &amp; Dev Portal - Coming Soon.html#home\">Explore the API<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<div data-rc-footer><\u002Fdiv>\n\n<script src=\"https://unpkg.com/lucide@latest\"><\u002Fscript>\n<script src=\"site/nav.js\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
