<!-- @dsCard group="Components" viewport="700x230" subtitle="Variants, sizes, icons, states" name="Buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  #root { padding: 24px; }
  .grp { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .lab { font-family: var(--rc-font-mono); font-size: 10.5px; color: var(--rc-text-3); width: 100%; margin-bottom: 2px; }
</style>
</head>
<body>
  <div id="root" class="rc"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    function findNS(){ for (const k in window){ const v = window[k]; if (v && typeof v === "object" && v.Button) return v; } return {}; }
    const { Button } = findNS();
    function Demo(){
      return (
        <React.Fragment>
          <div className="lab">VARIANTS</div>
          <div className="grp">
            <Button variant="primary" iconRight="arrow-right">Get API keys</Button>
            <Button variant="secondary" icon="book-open">Docs</Button>
            <Button variant="ghost">Ghost</Button>
            <Button variant="accentSoft" icon="sparkles">AI</Button>
          </div>
          <div className="lab">DARK / ON-DARK</div>
          <div className="grp" style={{ background: "var(--rc-ink)", padding: 14, borderRadius: "var(--rc-r-md)" }}>
            <Button variant="dark">Dark</Button>
            <Button variant="onDark" icon="github">On dark</Button>
          </div>
          <div className="lab">SIZES</div>
          <div className="grp">
            <Button size="sm">Small</Button>
            <Button size="md">Medium</Button>
            <Button size="lg" iconRight="arrow-right">Large</Button>
          </div>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
  </script>
</body>
</html>
