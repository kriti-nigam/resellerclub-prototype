<!-- @dsCard group="Components" viewport="700x210" subtitle="Badges, method tags, status dots, inline code" name="Labels & tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  #root { padding: 24px; }
  .grp { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .lab { font-family: var(--rc-font-mono); font-size: 10.5px; color: var(--rc-text-3); width: 100%; margin-bottom: 2px; }
  .stat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--rc-text-2); }
</style>
</head>
<body>
  <div id="root" class="rc"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    function findNS(){ for (const k in window){ const v = window[k]; if (v && typeof v === "object" && v.Badge) return v; } return {}; }
    const { Badge, MethodTag, StatusDot, Code, Icon } = findNS();
    function Demo(){
      return (
        <React.Fragment>
          <div className="lab">BADGES</div>
          <div className="grp">
            <Badge tone="accent"><Icon name="sparkles" size={12} /> AI-ready</Badge>
            <Badge tone="success">Live</Badge>
            <Badge tone="teal">Stable</Badge>
            <Badge tone="warning">Beta</Badge>
            <Badge tone="danger">Deprecated</Badge>
            <Badge tone="dark">v2</Badge>
          </div>
          <div className="lab">METHOD TAGS</div>
          <div className="grp">
            <MethodTag method="GET" /><MethodTag method="POST" /><MethodTag method="PUT" /><MethodTag method="DELETE" />
          </div>
          <div className="lab">STATUS &amp; INLINE CODE</div>
          <div className="grp">
            <span className="stat"><StatusDot status="live" /> Live</span>
            <span className="stat"><StatusDot status="pending" /> Pending</span>
            <span className="stat"><StatusDot status="failed" /> Failed</span>
            <Code>/domains/register</Code>
          </div>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
  </script>
</body>
</html>
