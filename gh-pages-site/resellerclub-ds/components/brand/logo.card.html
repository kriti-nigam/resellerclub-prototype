<!-- @dsCard group="Components" viewport="700x170" subtitle="Mark + wordmark + product tag" name="Logo lockup" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); }
  #root { padding: 26px; display: flex; flex-direction: column; gap: 18px; }
  .dark { background: var(--rc-ink); padding: 18px 22px; border-radius: var(--rc-r-lg); }
</style>
</head>
<body>
  <div id="root" class="rc"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    function findNS(){ for (const k in window){ const v = window[k]; if (v && typeof v === "object" && v.Logo) return v; } return {}; }
    const { Logo, Mark } = findNS();
    function Demo(){
      return (
        <React.Fragment>
          <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
            <Logo size={32} tag="Developers" />
            <Mark size={40} />
          </div>
          <div className="dark"><Logo size={30} dark tag="API" /></div>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
