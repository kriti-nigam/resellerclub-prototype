<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Corner radii — controls to cards" name="Radii" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .col { text-align: center; }
  .box { width: 64px; height: 64px; background: var(--rc-accent-50); border: 1.5px solid var(--rc-accent); }
  .n { font-family: var(--rc-font-mono); font-size: 10.5px; color: var(--rc-text-2); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--rc-r-sm)"></div><div class="n">sm · 8</div></div>
    <div class="col"><div class="box" style="border-radius:var(--rc-r-md)"></div><div class="n">md · 10</div></div>
    <div class="col"><div class="box" style="border-radius:var(--rc-r-lg)"></div><div class="n">lg · 14</div></div>
    <div class="col"><div class="box" style="border-radius:var(--rc-r-xl)"></div><div class="n">xl · 18</div></div>
    <div class="col"><div class="box" style="border-radius:var(--rc-r-2xl)"></div><div class="n">2xl · 24</div></div>
    <div class="col"><div class="box" style="border-radius:var(--rc-r-pill)"></div><div class="n">pill</div></div>
  </div>
</body>
</html>
