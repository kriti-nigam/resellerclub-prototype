<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Slate-tinted elevation + accent glow" name="Shadows & elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); padding: 30px 24px; }
  .row { display: flex; gap: 26px; }
  .col { text-align: center; }
  .box { width: 90px; height: 56px; background: var(--rc-white); border-radius: var(--rc-r-md); }
  .glow { background: var(--rc-accent); }
  .n { font-family: var(--rc-font-mono); font-size: 10.5px; color: var(--rc-text-2); margin-top: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--rc-shadow-xs)"></div><div class="n">xs</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--rc-shadow-sm)"></div><div class="n">sm</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--rc-shadow-md)"></div><div class="n">md</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--rc-shadow-lg)"></div><div class="n">lg</div></div>
    <div class="col"><div class="box glow" style="box-shadow:var(--rc-shadow-accent)"></div><div class="n">accent glow</div></div>
  </div>
</body>
</html>
