<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base scale" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-body); background: var(--rc-bg); padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .col { text-align: center; }
  .bar { background: var(--rc-accent); border-radius: 3px 3px 0 0; width: 26px; }
  .n { font-family: var(--rc-font-mono); font-size: 10.5px; color: var(--rc-text-2); margin-top: 7px; }
  .px { font-family: var(--rc-font-mono); font-size: 10px; color: var(--rc-text-3); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:8px"></div><div class="n">s-2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="n">s-3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="n">s-4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="n">s-6</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="n">s-8</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="n">s-12</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="n">s-16</div><div class="px">64</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="n">s-20</div><div class="px">80</div></div>
  </div>
</body>
</html>
