<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--rc-font-display); background: var(--rc-bg); padding: 24px; color: var(--rc-text); }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .tag { font-family: var(--rc-font-mono); font-size: 10.5px; color: var(--rc-text-3); width: 84px; flex-shrink: 0; }
  .xl { font: var(--rc-display-lg); letter-spacing: -0.02em; }
  .md { font: var(--rc-display-md); }
  .sm { font: var(--rc-display-sm); }
</style>
</head>
<body>
  <div class="row"><span class="tag">display-lg<br>700</span><span class="xl">Built for resellers.</span></div>
  <div class="row"><span class="tag">display-md<br>600</span><span class="md">Register a domain in two calls</span></div>
  <div class="row"><span class="tag">display-sm<br>600</span><span class="sm">Authentication &amp; API keys</span></div>
</body>
</html>
