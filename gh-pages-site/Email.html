  src: url(\"b098dc87-e4b4-429b-a338-7571c3ac7ffa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1cca62fe-74b9-4341-9d02-194097730d03\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c16f9390-0946-46a8-b901-0fd184ece6e9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b098dc87-e4b4-429b-a338-7571c3ac7ffa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Families ---- */\n  --rc-font-display: 'Space Grotesk', 'Hanken Grotesk', system-ui, sans-serif;\n  --rc-font-body:    'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;\n  --rc-font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* ---- Display type scale (clamped for fluid heroes) ---- */\n  --rc-display-xl: 700 clamp(40px, 5.2vw, 68px)/1.05 var(--rc-font-display);\n  --rc-display-lg: 700 clamp(32px, 3.6vw, 46px)/1.08 var(--rc-font-display);\n  --rc-display-md: 600 28px/1.12 var(--rc-font-display);\n  --rc-display-sm: 600 21px/1.2  var(--rc-font-display);\n\n  /* ---- Body scale ---- */\n  --rc-body-lg: 500 18px/1.6 var(--rc-font-body);\n  --rc-body:    400 16px/1.6 var(--rc-font-body);\n  --rc-body-sm: 400 14px/1.55 var(--rc-font-body);\n  --rc-caption: 500 12.5px/1.45 var(--rc-font-body);\n\n  /* ---- Tracking ---- */\n  --rc-track-tight:  -0.02em;  /* headlines */\n  --rc-track-snug:   -0.01em;  /* buttons, large body */\n  --rc-track-eyebrow: 0.16em;  /* uppercase eyebrows */\n}\n\n/* ============================================================\n   Color tokens.\n   Signature accent is one bright blue (#1E66FF). The system stays\n   disciplined — accent for action, deep slate ink for dark surfaces,\n   warm-neutral whites for backgrounds, plus a small semantic set\n   (teal/violet/amber/red) reserved for API methods & status.\n   ============================================================ */\n\n:root {\n  /* ---- Signature accent (bright blue) ---- */\n  --rc-accent:        #1E66FF;\n  --rc-accent-600:    #0F52E0;   /* hover */\n  --rc-accent-700:    #0A3FB0;   /* press / accent text on light */\n  --rc-accent-100:    #D7E4FF;   /* soft fill border */\n  --rc-accent-50:     #EDF3FF;   /* soft fill */\n  --rc-accent-tint:   #F4F7FE;   /* whisper-cool panel */\n  --rc-accent-300:    #3D82FF;   /* gradient top / brand mark */\n\n  /* ---- Ink / dark surfaces ---- */\n  --rc-ink:           #0C1322;   /* deepest */\n  --rc-ink-2:         #131C30;\n  --rc-ink-3:         #1E2940;\n  --rc-code-bg:       #0B1020;   /* code panel */\n  --rc-code-bg-2:     #121A2C;   /* code panel header / inset */\n\n  /* ---- Neutrals ---- */\n  --rc-white:         #FFFFFF;\n  --rc-bg:            #FFFFFF;\n  --rc-bg-subtle:     #F7F8FA;\n  --rc-bg-warm:       #FBF7F4;\n  --rc-line:          #E8EAEF;\n  --rc-line-2:        #EEF0F4;\n  --rc-line-strong:   #D7DBE2;\n  --rc-text:          #10151F;\n  --rc-text-2:        #515A6B;\n  --rc-text-3:        #8B93A2;\n  --rc-on-dark:       #FFFFFF;\n  --rc-on-dark-2:     #AEB7CA;\n  --rc-on-dark-3:     #707B92;\n\n  /* ---- Supporting / semantic (API methods, status, savings) ---- */\n  --rc-teal:          #0FA68A;   /* GET / success */\n  --rc-teal-soft:     #E2F5F0;\n  --rc-green:         #16A34A;   /* active / live */\n  --rc-green-soft:    #E6F6EC;\n  --rc-amber:         #E89611;   /* PUT / warning / pending */\n  --rc-amber-soft:    #FCF1DC;\n  --rc-red:           #E23B3B;   /* DELETE / danger / failed */\n  --rc-red-soft:      #FCE6E6;\n  --rc-violet:        #6D5EF6;   /* POST / accents */\n  --rc-violet-soft:   #ECEAFE;\n  --rc-blue:          #2563EB;\n  --rc-blue-soft:     #E5EDFD;\n}\n\n/* ============================================================\n   Layout tokens — radii, spacing scale (4px base), elevation, motion.\n   ============================================================ */\n\n:root {\n  /* ---- Radii ---- */\n  --rc-r-xs:   4px;\n  --rc-r-sm:   8px;\n  --rc-r-md:   10px;   /* default button / control */\n  --rc-r-lg:   14px;   /* code panels, cards */\n  --rc-r-xl:   18px;\n  --rc-r-2xl:  24px;\n  --rc-r-pill: 999px;  /* badges, dots */\n\n  /* ---- Spacing (4px base) ---- */\n  --rc-s-1: 4px;  --rc-s-2: 8px;   --rc-s-3: 12px;  --rc-s-4: 16px;\n  --rc-s-5: 20px; --rc-s-6: 24px;  --rc-s-8: 32px;  --rc-s-10: 40px;\n  --rc-s-12: 48px; --rc-s-16: 64px; --rc-s-20: 80px; --rc-s-24: 96px;\n\n  /* ---- Shadows (slate-tinted, never harsh black) ---- */\n  --rc-shadow-xs:     0 1px 2px rgba(12,19,34,.06);\n  --rc-shadow-sm:     0 2px 8px rgba(12,19,34,.07);\n  --rc-shadow-md:     0 10px 28px rgba(12,19,34,.10);\n  --rc-shadow-lg:     0 24px 60px rgba(12,19,34,.16);\n  --rc-shadow-accent: 0 10px 26px rgba(30,102,255,.32);   /* primary-button glow on hover */\n  --rc-ring:          0 0 0 4px rgba(30,102,255,.20);      /* focus ring */\n\n  /* ---- Motion ---- */\n  --rc-ease:     cubic-bezier(0.2, 0.7, 0.2, 1);   /* snappy in, smooth out */\n  --rc-ease-out: cubic-bezier(0, 0, 0.2, 1);\n  --rc-dur-fast: 120ms;   /* state toggles */\n  --rc-dur:      200ms;   /* default */\n  --rc-dur-slow: 320ms;   /* panel slides */\n}\n\n/* ============================================================\n   Base styles & helpers.\n   Wrap product content in class=\"rc\" to inherit the type defaults.\n   Everything below leans on the token vars, so it themes automatically.\n   ============================================================ */\n\n* { box-sizing: border-box; }\n\n.rc {\n  font-family: var(--rc-font-body);\n  color: var(--rc-text);\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n.rc h1, .rc h2, .rc h3, .rc h4, .rc h5 {\n  font-family: var(--rc-font-display);\n  margin: 0;\n  letter-spacing: var(--rc-track-tight);\n  color: var(--rc-text);\n  line-height: 1.08;\n  text-wrap: balance;\n}\n\n.rc p { margin: 0; }\n.rc a { color: inherit; text-decoration: none; }\n.rc button { font-family: inherit; }\n\n/* Eyebrow — uppercase, wide tracking, accent-700 */\n.rc-eyebrow {\n  font-family: var(--rc-font-body);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: var(--rc-track-eyebrow);\n  text-transform: uppercase;\n  color: var(--rc-accent-700);\n}\n\n/* Scrollbar polish for dark code panels */\n.rc-scroll::-webkit-scrollbar { height: 8px; width: 8px; }\n.rc-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 999px; }\n.rc-scroll::-webkit-scrollbar-track { background: transparent; }\n\n/* Selection */\n.rc ::selection { background: rgba(30,102,255,.22); }\n\n/* ---- Code syntax tokens (dark panels) ---- */\n.tk-key  { color: #6FB0FF; }\n.tk-str  { color: #7CD9A8; }\n.tk-num  { color: #E6B673; }\n.tk-bool { color: #C792EA; }\n.tk-kw   { color: #6FB0FF; }\n.tk-com  { color: #5C6680; font-style: italic; }\n\n/* ---- Keyframes ---- */\n@keyframes rc-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n@keyframes rc-fade    { from { opacity: 0; } to { opacity: 1; } }\n@keyframes rc-spin    { to { transform: rotate(360deg); } }\n@keyframes rc-pulse   { 0%,100% { opacity: 1; } 50% { opacity: .4; } }\n\n<\u002Fstyle>\n<style>/* ============================================================\n   ResellerClub wholesale site — shared component styles.\n   Consumes resellerclub-ds tokens. Link AFTER resellerclub-ds/styles.css.\n   All page chrome (nav, footer), section scaffolding, cards,\n   heroes, proof strips, code panels, tables, FAQ and CTA bands.\n   ============================================================ */\n\nhtml, body { margin: 0; padding: 0; background: var(--rc-bg); }\nmain { display: block; }\nimg { display: block; max-width: 100%; }\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }\n.wrap-narrow { max-width: 940px; margin: 0 auto; padding: 0 28px; }\nsection { position: relative; }\n\n/* ---- image / illustration placeholder ---- */\n.ph { position: relative; background: repeating-linear-gradient(135deg, var(--rc-bg-subtle) 0 14px, #eef0f4 14px 28px);\n  border: 1px solid var(--rc-line); border-radius: var(--rc-r-lg); overflow: hidden; }\n.ph::after { content: attr(data-label); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;\n  font-family: var(--rc-font-mono); font-size: 12px; color: var(--rc-text-3); letter-spacing: .02em; text-align: center; padding: 12px; }\n.ph.dark { background: repeating-linear-gradient(135deg, #16213a 0 14px, #1b2840 14px 28px); border-color: rgba(255,255,255,.08); }\n.ph.dark::after { color: var(--rc-on-dark-3); }\n\n/* ---- placeholder marker for unconfirmed numbers / claims ---- */\n.tbd { font-family: var(--rc-font-mono); font-size: .58em; font-weight: 600; color: var(--rc-text-3);\n  background: var(--rc-bg-subtle); border: 1px dashed var(--rc-line-strong); border-radius: 5px; padding: 2px 6px;\n  vertical-align: middle; letter-spacing: .01em; white-space: nowrap; }\n.ph-tag { font-family: var(--rc-font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;\n  color: var(--rc-text-3); background: var(--rc-bg-subtle); border: 1px dashed var(--rc-line-strong); border-radius: var(--rc-r-pill);\n  padding: 3px 9px; display: inline-block; }\n\n/* ============================================================\n   Buttons (scoped under .rc so DS `.rc a {color:inherit}` cannot win)\n   ============================================================ */\n.rc .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--rc-font-body); font-weight: 600; font-size: 15px;\n  letter-spacing: -.01em; border-radius: var(--rc-r-md); padding: 12px 20px; cursor: pointer; border: 1px solid transparent;\n  transition: all var(--rc-dur) var(--rc-ease); white-space: nowrap; text-decoration: none; }\n.rc .btn.lg { padding: 15px 26px; font-size: 16px; }\n.rc .btn.sm { padding: 9px 15px; font-size: 14px; }\n.rc .btn-primary { background: var(--rc-accent); color: #fff; }\n.rc .btn-primary:hover { background: var(--rc-accent-600); box-shadow: var(--rc-shadow-accent); transform: translateY(-1px); }\n.rc .btn-secondary { background: #fff; color: var(--rc-text); border-color: var(--rc-line-strong); box-shadow: var(--rc-shadow-xs); }\n.rc .btn-secondary:hover { background: var(--rc-bg-subtle); }\n.rc .btn-ghost { background: transparent; color: var(--rc-text-2); }\n.rc .btn-ghost:hover { color: var(--rc-text); }\n.rc .btn-ondark { background: rgba(255,255,255,.10); color: #fff; border-color: rgba(255,255,255,.22); }\n.rc .btn-ondark:hover { background: rgba(255,255,255,.18); }\n.rc .btn-light { background: #fff; color: var(--rc-ink); }\n.rc .btn-light:hover { box-shadow: var(--rc-shadow-md); transform: translateY(-1px); }\n\n.rc .tlink { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; color: var(--rc-accent-700); }\n.rc : 13px; margin-top: 30px; justify-content: center; flex-wrap: wrap; }\n.trust-line { display: flex; gap: 10px 14px; margin-top: 26px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 13.5px; color: var(--rc-text-2); }\n.trust-line .ti { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }\n.trust-line .ti .ic { color: var(--rc-accent); }\n.trust-line .dot-sep { color: var(--rc-line-strong); }\n\n/* ============================================================\n   Split hero (product pages, platform)\n   ============================================================ */\n.split-hero { padding: 64px 0 70px; }\n.split-grid { display: grid; grid-template-columns: 1.02fr 1fr; gap: 56px; align-items: center; }\n.split-copy h1 { font-family: var(--rc-font-display); font-weight: 700; font-size: clamp(34px, 4vw, 52px); line-height: 1.06;\n  letter-spacing: -.025em; color: var(--rc-text); margin: 16px 0 0; }\n.split-copy h1 .accent { color: var(--rc-accent); }\n.split-copy p.anchor { font-family: var(--rc-font-display); font-weight: 500; font-size: clamp(18px, 1.7vw, 22px); line-height: 1.38; letter-spacing: -.01em; color: var(--rc-text); margin: 18px 0 0; max-width: 520px; }\n.split-copy p.lead { font-size: 17.5px; line-height: 1.6; color: var(--rc-text-2); margin: 20px 0 0; max-width: 540px; }\n.split-copy .hero-cta { justify-content: flex-start; }\n.split-copy .trust-line { justify-content: flex-start; }\n\n/* illustration panel (non-transacting interface illustration) */\n.illus { position: relative; }\n.illus .glow { position: absolute; inset: -40px -20px; background: radial-gradient(420px 300px at 60% 40%, rgba(30,102,255,.16), transparent 70%); pointer-events: none; }\n.panel { position: relative; background: #fff; border: 1px solid var(--rc-line); border-radius: var(--rc-r-xl); box-shadow: var(--rc-shadow-lg); overflow: hidden; }\n.panel-head { display: flex; align-items: center; gap: 8px; padding: 13px 16px; background: var(-- align-items:center; justify-content:center; background:var(--rc-accent-50); color:var(--rc-accent) }\n  .flow .fstep h4 { font-family:var(--rc-font-display); font-size:18px; font-weight:600; letter-spacing:-.01em; color:var(--rc-text); margin:0 }\n  .flow .fstep p { font-size:13.5px; line-height:1.5; color:var(--rc-text-2); margin:0 }\n  .flow .farrow { display:flex; align-items:center; color:var(--rc-text-3) }\n  @media (max-width:900px){ .flow{flex-direction:column; align-items:center} .flow .farrow{transform:rotate(90deg)} }\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"rc\">\n\n<!-- ============ HEADER ============ -->\n<header class=\"topbar\">\n  <nav class=\"wrap nav-inner\" aria-label=\"Primary\">\n    <a class=\"logo\" href=\"ResellerClub Homepage.html\"><img src=\"18f1ccf4-6e14-410c-8cc8-f8f3fa5b6e0b\" alt=\"ResellerClub home\"><span class=\"name\">ResellerClub<\u002Fspan><\u002Fa>\n    <div class=\"menu\">\n      <div class=\"nav-item active\">\n        <a>Products <i data-lucide=\"chevron-down\" class=\"chev\"><\u002Fi><\u002Fa>\n        <div class=\"mega wide\">\n          <span class=\"mega-label\">Products<\u002Fspan>\n          <a class=\"mega-link\" href=\"Domains.html\"><span class=\"mi\"><i data-lucide=\"globe\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Domains<\u002Fspan><span class=\"md\">Wholesale across legacy and new TLDs<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"Email.html\"><span class=\"mi\"><i data-lucide=\"mail\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Email &amp; productivity<\u002Fspan><span class=\"md\">Titan and Google Workspace<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"SSL Certificates.html\"><span class=\"mi\"><i data-lucide=\"shield-check\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">SSL certificates<\u002Fspan><span class=\"md\">DV to EV, resold under your brand<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"Hosting.html\"><span class=\"mi\"><i data-lucide=\"server\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Hosting<\u002Fspan><span class=\"md\">Oracle Cloud powered, resell suite<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"ResellerClub Homepage.html#ecosystem\"><span class=\"mi\"><i data-lucide=\"lock\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Security add-ons<\u002Fspan><span class=\"md\">SiteLock and Xcitium<\u002Fspan><\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"nav-item\">\n        <a href=\"Platform &amp; API.html\">Platform<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"nav-item\"><a href=\"API &amp; Dev Portal - Coming Soon.html\">API &amp; Developer Portal<\u002Fa><\u002Fdiv>\n      <div class=\"nav-item\">\n        <a href=\"Who Its For - Web Hosts and Agencies.html\">Who it’s for<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"nav-item\"><a href=\"Pricing.html\">Pricing<\u002Fa><\u002Fdiv>\n      <div class=\"nav-item\">\n        <a>Resources <i data-lucide=\"chevron-down\" class=\"chev\"><\u002Fi><\u002Fa>\n        <div class=\"mega right\">\n          <a class=\"mega-link\" href=\"Developer Portal.html#docs:introduction\"><span class=\"mi\"><i data-lucide=\"book-open\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Docs<\u002Fspan><span class=\"md\">Product and API documentation<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"#\"><span class=\"mi\"><i data-lucide=\"life-buoy\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Help center<\u002Fspan><span class=\"md\">Answers and how-tos<\u002Fspan><\u002Fspan><\u002Fa>\n          <a class=\"mega-link\" href=\"#\"><span class=\"mi\"><i data-lucide=\"newspaper\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fspan><span><span class=\"mt\">Blog<\u002Fspan><span class=\"md\">Product news and guides<\u002Fspan><\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"nav-right\">\n      <a class=\"btn btn-ghost sm\" href=\"Sign In.html\">Sign in<\u002Fa>\n      <a class=\"btn btn-primary sm\" href=\"Become a Reseller.html\">Become a reseller<\u002Fa>\n    <\u002Fdiv>\n    <button class=\"hamburger\" aria-label=\"Menu\"><i data-lucide=\"menu\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fbutton>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n\n  <!-- ============ HERO (split) ============ -->\n  <section class=\"split-hero\">\n    <div class=\"wrap split-grid\">\n      <div class=\"split-copy\">\n        <span class=\"eyebrow\">Productivity<\u002Fspan>\n        <h1>Resell professional <span class=\"accent\">email<\u002Fspan> and <span class=\"accent\">Google Workspace<\u002Fspan> to your customers.<\u002Fh1>\n        <p class=\"lead\">A professional email address on a custom domain is the first signal a business is real — customers trust mail from you@yourbusiness.com far more than a free inbox. It keeps branding consistent, data secure, and communication credible.<\u002Fp>\n        <div class=\"hero-cta\">\n          <a class=\"btn btn-primary lg\" href=\"Become a Reseller.html\">Become a reseller<\u002Fa>\n          <a class=\"btn btn-secondary lg\" href=\"Developer Portal.html#home\">Explore the API <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n        <div class=\"trust-line\">\n          <span class=\"ti\"><i data-lucide=\"calendar-clock\" class=\"ic\" style=\"width:16px;height:16px\"><\u002Fi> 20+ years in the industry<\u002Fspan>\n          <span class=\"dot-sep\">·<\u002Fspan>\n          <span class=\"ti\"><i data-lucide=\"shield-check\" class=\"ic\" style=\"width:16px;height:16px\"><\u002Fi> 100+ ICANN-accredited registrars on OrderBox<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"illus\">\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"panel\">\n          <div class=\"panel-head\">\n            <span class=\"dot\" style=\"background:#FF5F57\"><\u002Fspan><span class=\"dot\" style=\"background:#FEBC2E\"><\u002Fspan><span class=\"dot\" style=\"background:#28C840\"><\u002Fspan>\n            <span class=\"ptitle\">reseller-panel / mailboxes<\u002Fspan>\n            <span class=\"ptag\"><i data-lucide=\"inbox\" style=\"width:13px;height:13px\"><\u002Fi> control panel<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"panel-body\">\n            <div class=\"drow\"><i data-lucide=\"at-sign\" style=\"width:18px;height:18px;color:var(--rc-accent)\"><\u002Fi><span class=\"dname\">you@yourcustomer.com<\u002Fspan><span class=\"chips\"><span class=\"chip ok\">Active<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div class=\"drow\"><i data-lucide=\"at-sign\" style=\"width:18px;height:18px;color:var(--rc-accent)\"><\u002Fi><span class=\"dname\">sales@studio.agency<\u002Fspan><span class=\"chips\"><span class=\"chip ok\">Active<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div class=\"drow\"><i data-lucide=\"at-sign\" style=\"width:18px;height:18px;color:var(--rc-accent)\"><\u002Fi><span class=\"dname\">billing@buildwith.dev<\u002Fspan><span class=\"chips\"><span class=\"chip ok\">Active<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n        \n      \n    \n  \n\n  <!-- ============ EMAIL PLANS ============ -->\n  <section class=\"sec alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">What you can resell<\u002Fspan>\n        <h2>Four email products, one reseller account.<\u002Fh2>\n        <p>Offer the email product that fits each customer. All four are billed and managed through your ResellerClub account, so you keep one relationship and one bill per customer.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"grid-4\">\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"mail\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Business Email<\u002Fh3>\n          <p>Professional, entry-level email for startups and small businesses.<\u002Fp>\n          <ul class=\"plist\">\n            <li><i data-lucide=\"check\"><\u002Fi>5 GB storage per account<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Email on your customer’s own domain<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>POP3, IMAP &amp; webmail sync across devices<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Calendar, contacts &amp; auto-responders<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>ClamAV anti-virus &amp; branded SSL<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Add 5 GB storage blocks as needs grow<\u002Fli>\n          <\u002Ful>\n          <div class=\"price-teaser see-pricing\" style=\"margin-top:auto;padding-top:18px\"><span class=\"from\">from<\u002Fspan> <span class=\"amt\"><span class=\"tbd\">price<\u002Fspan>/acc/mo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"building-2\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Enterprise Email<\u002Fh3>\n          <p>A robust email solution for growing teams and businesses.<\u002Fp>\n          <ul class=\"plist\">\n            <li><i data-lucide=\"check\"><\u002Fi>30 GB mailbox storage per account<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Additional storage at $0.20 / 5 GB<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Intuitive calendar &amp; address book<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Sync email across all devices<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Auto-responders &amp; email forwarding<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Cloudmark protection &amp; branded SSL<\u002Fli>\n          <\u002Ful>\n          <div class=\"price-teaser see-pricing\" style=\"margin-top:auto;padding-top:18px\"><span class=\"from\">from<\u002Fspan> <span class=\"amt\">$1.50/acc/mo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"send\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Titan Email<\u002Fh3>\n          <p>Modern business email built for small businesses, white-label ready.<\u002Fp>\n          <ul class=\"plist\">\n            <li><i data-lucide=\"check\"><\u002Fi>Mailboxes on your customer’s domain<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Clean webmail plus mobile apps<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Read receipts, follow-up reminders &amp; templates<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Calendar &amp; contacts built in<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>One-click migration from existing mail<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Resell under your own brand<\u002Fli>\n          <\u002Ful>\n          <div class=\"price-teaser see-pricing\" style=\"margin-top:auto;padding-top:18px\"><span class=\"from\">from<\u002Fspan> <span class=\"amt\"><span class=\"tbd\">price<\u002Fspan>/acc/mo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"grid-3x3\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Google Workspace<\u002Fh3>\n          <p>Google’s full productivity suite, resold through your account.<\u002Fp>\n          <ul class=\"plist\">\n            <li><i data-lucide=\"check\"><\u002Fi>Gmail on your customer’s domain<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>30 GB storage per user<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Docs, Sheets, Drive &amp; Meet included<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Shared calendars &amp; video meetings<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Google’s proprietary spam protection<\u002Fli>\n            <li><i data-lucide=\"check\"><\u002Fi>Google-branded, resold as-is<\u002Fli>\n          <\u002Ful>\n          <div class=\"price-teaser see-pricing\" style=\"margin-top:auto;padding-top:18px\"><span class=\"from\">from<\u002Fspan> <span class=\"amt\"><span class=\"tbd\">price<\u002Fspan>/acc/mo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ WHY RESELL EMAIL ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">Why email<\u002Fspan>\n        <h2>Email turns a one-time domain sale into recurring revenue.<\u002Fh2>\n        <p>Domains open the relationship. Email keeps it active and billing every month. Here is what email adds to your channel business.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"grid-2\">\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"repeat\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>Recurring revenue<\u002Fh3><p>Email bills on a recurring basis, per mailbox. It turns a domain customer into a steady monthly revenue line, on top of the registration you already sell. <span class=\"tbd\">ARPU example<\u002Fspan><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"link\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>Attaches to every domain you sell<\u002Fh3><p>Every domain is a reason to sell a mailbox. Email is the most natural add-on at the moment a customer registers or renews a domain, so attach rates can be high when you offer it at that point.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"anchor\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>Customer stickiness<\u002Fh3><p>A customer who runs their email through you is far harder to move. Mailboxes hold years of mail, contacts, and calendars, so the relationship stays with you across renewals.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pillar\">\n          <span class=\"pic\"><i data-lucide=\"trending-up\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <div><h3>Margin you keep<\u002Fh3><p>You buy at wholesale and set your own retail price, so the margin stays with you on every mailbox. You own the customer and the billing relationship in all cases. Business Email by Titan can be sold under your own brand <span class=\"tbd\">confirm<\u002Fspan>, while Google Workspace is resold as a Google-branded product.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FEATURE HIGHLIGHTS ============ -->\n  <section class=\"sec alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">What is included<\u002Fspan>\n        <h2>The features customers expect from professional email.<\u002Fh2>\n        <p>Exact features and limits vary by product and plan, confirmed on the Pricing page. The essentials below are what your customers get with professional email.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feat-grid c3\">\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"database\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Mailbox storage<\u002Fh4><p>Storage per mailbox so customers are not constantly clearing space. <span class=\"tbd\">N GB<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"shield\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Spam and virus filtering<\u002Fh4><p>Inbound filtering to keep spam and malicious mail out of customer inboxes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"import\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Migration tool<\u002Fh4><p>Move existing mail into the new mailbox so customers do not lose history when they switch.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"monitor\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Webmail<\u002Fh4><p>A browser-based inbox customers can reach from any device, with no setup.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"smartphone\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Mobile access<\u002Fh4><p>Standard mobile and desktop client support, so mail works on the devices customers already use.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"feat\"><span class=\"fic\"><i data-lucide=\"calendar\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fspan><div><h4>Calendars and contacts<\u002Fh4><p>Shared calendars and contacts for everyday coordination across a team.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-family:var(--rc-font-mono);font-size:11.5px;color:var(--rc-text-3);margin:30px auto 0;text-align:center;max-width:680px;line-height:1.6\">Features and limits differ between Business Email by Titan and Google Workspace, and by plan. See the Pricing page for current details.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BUILT TO ATTACH TO DOMAINS ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">Attach and grow<\u002Fspan>\n        <h2>Sell the mailbox at the same moment you sell the domain.<\u002Fh2>\n        <p>Email is the add-on that fits domains the most naturally. A customer who just bought a domain needs a mailbox on it, so the easiest time to sell email is at registration or renewal.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"flow\">\n        <div class=\"fstep\">\n          <span class=\"sic\"><i data-lucide=\"globe\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h4>Sell domain<\u002Fh4>\n          <p>Customer buys or renews a domain through you.<\u002Fp>\n        <\u002Fdiv>\n        <span class=\"farrow\"><i data-lucide=\"arrow-right\" style=\"width:26px;height:26px\"><\u002Fi><\u002Fspan>\n        <div class=\"fstep\">\n          <span class=\"sic\"><i data-lucide=\"at-sign\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h4>Attach mailbox<\u002Fh4>\n          <p>You offer a mailbox on that same domain, at your retail price.<\u002Fp>\n        <\u002Fdiv>\n        <span class=\"farrow\"><i data-lucide=\"arrow-right\" style=\"width:26px;height:26px\"><\u002Fi><\u002Fspan>\n        <div class=\"fstep\">\n          <span class=\"sic\"><i data-lucide=\"repeat\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h4>Recurring revenue<\u002Fh4>\n          <p>Email bills on a recurring basis, and you keep the customer and the margin.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ MANAGEMENT AND SUPPORT ============ -->\n  <section class=\"sec alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">How you run it<\u002Fspan>\n        <h2>Provision and manage mailboxes from one place.<\u002Fh2>\n        <p>Whether you manage a handful of mailboxes or thousands across many customers, you run email from the same account you use for domains.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"grid-3\">\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"layout-dashboard\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Reseller control panel<\u002Fh3>\n          <p>Create, manage, and bill mailboxes from one panel, alongside the domains they sit on. Run day-to-day mailbox operations without writing code.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"layers-3\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Provisioning at scale<\u002Fh3>\n          <p>Provision and manage mailboxes programmatically through the API, and run bulk actions across many customers at once. Built for portfolios, not single mailboxes.<\u002Fp>\n          <a class=\"tlink\" style=\"margin-top:14px\" href=\"Developer Portal.html#home\">Explore the API <i data-lucide=\"arrow-right\" style=\"width:14px;height:14px\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <span class=\"cic\"><i data-lucide=\"headset\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fspan>\n          <h3>Support<\u002Fh3>\n          <p>Platform and reseller support stands behind the email products you sell, so you are not the only line of help for your customers. <span class=\"tbd\">support scope and hours<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FAQ ============ -->\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <span class=\"sec-eyebrow\">FAQ<\u002Fspan>\n        <h2>Frequently asked questions.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"faq\">\n        <details open=\"\">\n          <summary>Which email products can I resell? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary>\n          <div class=\"fa-body\">Four — Business Email, Enterprise Email, Titan Email and Google Workspace. All are provisioned, billed and managed through your single ResellerClub account, so you keep one relationship and one bill per customer.<\u002Fdiv>\n        <\u002Fdetails>\n        <details>\n          <summary>What is the difference between Business and Enterprise Email? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary>\n          <div class=\"fa-body\">Storage and scale. Business Email is the professional entry point with 5 GB per account; Enterprise Email steps up to 30 GB per account with additional 5 GB storage blocks available. Both put mailboxes on your customer’s own domain with calendars, sync and anti-virus protection.<\u002Fdiv>\n        <\u002Fdetails>\n        <details>\n          <summary>Can I sell email under my own brand? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary>\n          <div class=\"fa-body\">Business Email, Enterprise Email and Titan Email are white-label ready — your customers see your brand, including a branded webmail URL. Google Workspace is a Google product, resold as-is and Google-branded, but you still own the customer and billing relationship.<\u002Fdiv>\n        <\u002Fdetails>\n        <details>\n          <summary>Which clients and protocols are supported? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary>\n          <div class=\"fa-body\">POP3, IMAP and webmail across the hosted email products, so mail works in the clients your customers already use — desktop, mobile or browser — and stays in sync across all of them.<\u002Fdiv>\n        <\u002Fdetails>\n        <details>\n          <summary>Can customers add mailboxes as they grow? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary>\n          <div class=\"fa-body\">Yes. Accounts can be added at any time from the admin panel, and storage can be extended in 5 GB blocks, so a customer never has to migrate away just because they grew.<\u002Fdiv>\n        <\u002Fdetails>\n        <details>\n          <summary>How do I manage mailboxes across many customers? <i data-lucide=\"plus\" class=\"fq-ic\" style=\"width:20px;height:20px\"><\u002Fi><\u002Fsummary>\n          <div class=\"fa-body\">From the same reseller control panel you use for domains — or programmatically through the API for bulk provisioning and management across your whole portfolio.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CLOSING CTA ============ -->\n  <section class=\"cta\">\n    <div class=\"wrap\">\n      <div class=\"cta-ink\">\n        <div class=\"glow\"><\u002Fdiv>\n        <span class=\"eyebrow\">Get started<\u002Fspan>\n        <h2>Add recurring email revenue to every domain you sell.<\u002Fh2>\n        <p>Become a reseller and resell Business Email by Titan and Google Workspace under your account, at wholesale, attached to the domains your customers already buy. Or look at the API first.<\u002Fp>\n        <div class=\"cta-actions\">\n          <a class=\"btn btn-primary lg\" href=\"Become a Reseller.html\">Become a reseller<\u002Fa>\n          <a class=\"btn btn-ondark lg\" href=\"Developer Portal.html#home\">Explore the API<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ============ FOOTER ============ -->\n<footer class=\"site-foot\">\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div class=\"foot-brand\">\n        <span class=\"logo\"><img src=\"18f1ccf4-6e14-410c-8cc8-f8f3fa5b6e0b\" alt=\"ResellerClub\" style=\"width:32px;height:32px\"><span class=\"name\">ResellerClub<\u002Fspan><\u002Fspan>\n        <p class=\"blurb\">The wholesale domain registrar built for the people who build the web.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h5>Products<\u002Fh5>\n        <a href=\"Domains.html\">Domains<\u002Fa><a href=\"Hosting.html\">Hosting<\u002Fa><a href=\"Email.html\">Email<\u002Fa><a href=\"SSL Certificates.html\">SSL certificates<\u002Fa>\n      <\u002F
