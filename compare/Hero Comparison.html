<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero comparison — product-led vs photographic</title>
<link rel="stylesheet" href="../resellerclub-ds/styles.css" />
<style>
  html, body { margin: 0; padding: 0; }
  .hero-art { width: 100%; height: 100%; background: var(--rc-bg); font-family: var(--rc-font-body); color: var(--rc-text); }

  /* buttons */
  .rc .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--rc-font-body); font-weight: 600; font-size: 15px; letter-spacing: -.01em; border-radius: var(--rc-r-md); padding: 13px 22px; cursor: pointer; border: 1px solid transparent; text-decoration: none; }
  .rc .btn.lg { padding: 15px 26px; font-size: 16px; }
  .rc .btn-primary { background: var(--rc-accent); color: #fff; }
  .rc .btn-secondary { background: #fff; color: var(--rc-text); border-color: var(--rc-line-strong); box-shadow: var(--rc-shadow-xs); }
  .rc .btn-light { background: #fff; color: var(--rc-ink); }
  .rc .btn-ondark { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.28); }
  .eyebrow { font-family: var(--rc-font-body); font-size: 12.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--rc-accent-700); }
  h1.hh { font-family: var(--rc-font-display); font-weight: 700; letter-spacing: -.025em; color: var(--rc-text); margin: 16px 0 0; }
  .hh .accent { color: var(--rc-accent); }
  .lead { font-size: 18px; line-height: 1.58; color: var(--rc-text-2); }
  .aud { display: flex; gap: 20px; flex-wrap: wrap; }
  .aud .a { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; color: var(--rc-text-2); }
  .aud .a .ic { color: var(--rc-accent); }

  /* ===== A · product-led ===== */
  .pl { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 50px 56px; height: 100%; box-sizing: border-box; justify-content: center; }
  .pl h1.hh { font-size: 52px; line-height: 1.04; max-width: 720px; }
  .pl .lead { margin: 20px auto 0; max-width: 560px; }
  .pl .cta { display: flex; gap: 12px; margin-top: 26px; }
  .pl .aud { justify-content: center; margin-top: 24px; }
  .flow { display: flex; align-items: stretch; gap: 0; margin-top: 40px; width: 100%; max-width: 980px; }
  .flow-step { flex: 1; display: flex; flex-direction: column; text-align: left; }
  .flow-arrow { display: flex; align-items: center; justify-content: center; padding: 0 12px; color: var(--rc-line-strong); }
  .flow-cap { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
  .flow-num { width: 23px; height: 23px; border-radius: 50%; background: var(--rc-accent); color: #fff; font-family: var(--rc-font-display); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center; }
  .flow-cap .ct { font-family: var(--rc-font-display); font-size: 16px; font-weight: 600; color: var(--rc-text); }
  .flow-card { background: #fff; border: 1px solid var(--rc-line); border-radius: var(--rc-r-lg); box-shadow: var(--rc-shadow-sm); padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 132px; }
  .flow-desc { font-size: 13px; line-height: 1.5; color: var(--rc-text-2); margin: 12px 2px 0; }
  .mini-code { background: var(--rc-code-bg); border-radius: var(--rc-r-md); padding: 13px 14px; font-family: var(--rc-font-mono); font-size: 11.5px; line-height: 1.7; color: #E7ECF5; }
  .mini-code .ok { color: var(--rc-teal); }
  .ms-head { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; margin-bottom: 9px; border-bottom: 1px solid var(--rc-line); }
  .ms-logo { width: 17px; height: 17px; border-radius: 5px; background: linear-gradient(135deg, var(--rc-accent-300), var(--rc-accent-600)); }
  .ms-brand { font-family: var(--rc-font-display); font-weight: 600; font-size: 13px; color: var(--rc-text); }
  .ms-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--rc-text-2); padding: 4px 0; }
  .ms-ck { color: var(--rc-green); display: inline-flex; }
  .me-fig { font-family: var(--rc-font-display); font-weight: 700; font-size: 32px; letter-spacing: -.02em; color: var(--rc-accent); line-height: 1; }
  .me-k { font-size: 12px; color: var(--rc-text-3); margin-top: 6px; }
  .me-pill { font-family: var(--rc-font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--rc-text-3); background: var(--rc-bg-subtle); border: 1px solid var(--rc-line); border-radius: var(--rc-r-pill); padding: 2px 7px; float: right; }

  /* ===== B · photographic ===== */
  .ph2 { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; padding: 50px 56px; height: 100%; box-sizing: border-box; }
  .ph2 h1.hh { font-size: 48px; line-height: 1.05; }
  .ph2 .lead { margin-top: 20px; max-width: 460px; }
  .ph2 .cta { display: flex; gap: 12px; margin-top: 28px; }
  .ph2 .trust { margin-top: 30px; display: flex; align-items: center; gap: 14px; }
  .ph2 .trust .stars { color: var(--rc-amber); display: inline-flex; gap: 2px; }
  .ph2 .trust .tt { font-size: 13px; color: var(--rc-text-2); }
  .photo { position: relative; height: 460px; border-radius: var(--rc-r-2xl); overflow: hidden; border: 1px solid var(--rc-line); }
  .photo-ph { position: absolute; inset: 0; background:
      radial-gradient(120% 90% at 70% 15%, #cfe0ff 0%, transparent 55%),
      radial-gradient(120% 90% at 20% 90%, #ffe2d2 0%, transparent 55%),
      linear-gradient(160deg, #e8eef7 0%, #dfe6f0 100%); }
  .photo-ph::after { content: "lifestyle / stock photo\A( agency team or business owner at work )"; white-space: pre; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--rc-font-mono); font-size: 13px; color: #6b7689; letter-spacing: .02em; }
  .photo .float { position: absolute; left: 20px; bottom: 20px; background: #fff; border: 1px solid var(--rc-line); border-radius: var(--rc-r-lg); box-shadow: var(--rc-shadow-lg); padding: 13px 16px; display: flex; align-items: center; gap: 12px; }
  .photo .float .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--rc-green); }
  .photo .float .v { font-family: var(--rc-font-display); font-weight: 700; font-size: 16px; color: var(--rc-text); }
  .photo .float .k { font-size: 12px; color: var(--rc-text-3); }

  .note { font-size: 13px; line-height: 1.55; color: var(--rc-text-2); background: #fff; border: 1px solid var(--rc-line); border-radius: var(--rc-r-md); padding: 12px 14px; max-width: 260px; }
  .note b { color: var(--rc-text); font-weight: 600; }
</style>
</head>
<body class="rc">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const { useEffect } = React;

    function ProductLed() {
      return (
        <div className="hero-art">
          <div className="pl">
            <span className="eyebrow">The domain platform behind your business</span>
            <h1 className="hh">Launch, sell, and scale <span className="accent">domains, fast.</span></h1>
            <p className="lead">For web hosts, developers and agencies, and AI and website-builder platforms. Provision and manage domains, email, SSL and hosting for your customers, under your own brand.</p>
            <div className="cta">
              <a className="btn btn-primary lg">Become a reseller</a>
              <a className="btn btn-secondary lg">Explore the API <i data-lucide="arrow-right" style={{width:18,height:18}}></i></a>
            </div>
            <div className="aud">
              <span className="a"><i data-lucide="server-cog" className="ic" style={{width:17,height:17}}></i> Web hosts</span>
              <span className="a"><i data-lucide="code-2" className="ic" style={{width:17,height:17}}></i> Developers and agencies</span>
              <span className="a"><i data-lucide="bot" className="ic" style={{width:17,height:17}}></i> AI and builder platforms</span>
            </div>

            <div className="flow">
              <div className="flow-step">
                <div className="flow-cap"><span className="flow-num">1</span><span className="ct">Integrate</span></div>
                <div className="flow-card">
                  <div className="mini-code">
                    <div><span style={{color:"#C792EA"}}>POST</span> <span style={{color:"#6FB0FF"}}>/domains</span></div>
                    <div>{'{ '}<span style={{color:"#7CD9A8"}}>"domain"</span>: <span style={{color:"#7CD9A8"}}>"acme.com"</span>,</div>
                    <div>&nbsp;&nbsp;<span style={{color:"#7CD9A8"}}>"years"</span>: <span style={{color:"#E6B673"}}>1</span> {'}'}</div>
                    <div className="ok">&#8594; registered</div>
                  </div>
                </div>
                <p className="flow-desc">One API call to register a domain, in your own product.</p>
              </div>
              <div className="flow-arrow"><i data-lucide="chevron-right" style={{width:24,height:24}}></i></div>
              <div className="flow-step">
                <div className="flow-cap"><span className="flow-num">2</span><span className="ct">Sell</span></div>
                <div className="flow-card">
                  <div>
                    <div className="ms-head"><span className="ms-logo"></span><span className="ms-brand">Your Brand</span></div>
                    <div className="ms-row"><span>Domains</span><span className="ms-ck"><i data-lucide="check" style={{width:15,height:15}}></i></span></div>
                    <div className="ms-row"><span>Email</span><span className="ms-ck"><i data-lucide="check" style={{width:15,height:15}}></i></span></div>
                    <div className="ms-row"><span>SSL certificates</span><span className="ms-ck"><i data-lucide="check" style={{width:15,height:15}}></i></span></div>
                  </div>
                </div>
                <p className="flow-desc">Sell under your own brand, your prices, your customers.</p>
              </div>
              <div className="flow-arrow"><i data-lucide="chevron-right" style={{width:24,height:24}}></i></div>
              <div className="flow-step">
                <div className="flow-cap"><span className="flow-num">3</span><span className="ct">Earn</span></div>
                <div className="flow-card">
                  <div>
                    <span className="me-pill">illustrative</span>
                    <div className="me-fig">+ $4,280</div>
                    <div className="me-k">Example reseller margin / mo</div>
                  </div>
                </div>
                <p className="flow-desc">Keep the wholesale margin on everything you sell.</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Photographic() {
      return (
        <div className="hero-art">
          <div className="ph2">
            <div>
              <span className="eyebrow">The domain platform behind your business</span>
              <h1 className="hh">Launch, sell, and scale <span className="accent">domains, fast.</span></h1>
              <p className="lead">For web hosts, developers and agencies, and AI and website-builder platforms. Provision and manage domains, email, SSL and hosting for your customers, under your own brand.</p>
              <div className="cta">
                <a className="btn btn-primary lg">Become a reseller</a>
                <a className="btn btn-secondary lg">Explore the API <i data-lucide="arrow-right" style={{width:18,height:18}}></i></a>
              </div>
              <div className="trust">
                <span className="stars"><i data-lucide="star" style={{width:15,height:15,fill:"currentColor"}}></i><i data-lucide="star" style={{width:15,height:15,fill:"currentColor"}}></i><i data-lucide="star" style={{width:15,height:15,fill:"currentColor"}}></i><i data-lucide="star" style={{width:15,height:15,fill:"currentColor"}}></i><i data-lucide="star" style={{width:15,height:15,fill:"currentColor"}}></i></span>
                <span className="tt">Trusted by 200,000+ resellers worldwide</span>
              </div>
            </div>
            <div className="photo">
              <div className="photo-ph"></div>
              <div className="float"><span className="dot"></span><span><span className="v">+ $4,280</span> <span className="k">margin / mo</span></span></div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      useEffect(() => {
        const t = setInterval(() => { if (window.lucide) { window.lucide.createIcons(); } }, 250);
        setTimeout(() => clearInterval(t), 2500);
        return () => clearInterval(t);
      }, []);
      return (
        <DesignCanvas>
          <DCSection id="hero" title="Homepage hero" subtitle="Product-led vs photographic — same headline, copy and brand">
            <DCArtboard id="product" label="A · Product-led (current)" width={1180} height={780}>
              <ProductLed />
            </DCArtboard>
            <DCArtboard id="photo" label="B · Photographic / lifestyle" width={1180} height={560}>
              <Photographic />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
